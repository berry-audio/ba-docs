info:
  name: playback.seek
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "playback.seek",
        "params": {
          "time_position": 100
        },
        "id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
