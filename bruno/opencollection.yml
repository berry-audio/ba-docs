opencollection: 1.0.0

info:
  name: Berryaudio API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseURL
      value: http://berryaudio.local:8080/rpc
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
