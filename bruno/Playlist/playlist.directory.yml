info:
  name: playlist.directory
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "playlist.directory",
        "params": {
          "uri": "playlist",
          "limit": 2,
          "offset": 0
        },
        "id": 5
      }
