info:
  name: config.set
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "config.set",
        "params":{
          "config": { "mixer": {  "initial_volume": 100  } } 
        },
        "id": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
